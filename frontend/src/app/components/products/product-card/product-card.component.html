<mat-card style="height:100%;display:flex;flex-direction:column">
      <img mat-card-image
           [src]="product.image || 'https://via.placeholder.com/300x200'"
           [alt]="product.name"
           style="height:200px;object-fit:cover">

      <mat-card-header>
        <mat-card-title>{{ product.name }}</mat-card-title>
        <mat-card-subtitle>
          <mat-chip-set>
            <mat-chip color="primary">{{ product.category?.name }}</mat-chip>
          </mat-chip-set>
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content style="flex:1">
        <p>{{ product.description | slice:0:80 }}...</p>
        <div style="display:flex;align-items:center;gap:8px">
          <mat-icon style="color:gold;font-size:18px">star</mat-icon>
          <span>{{ product.ratings | number:'1.1-1' }} ({{ product.numReviews }} reviews)</span>
        </div>
        <h3 style="color:#1976d2">₹{{ product.price | number }}</h3>
        <small [style.color]="product.stock > 0 ? 'green' : 'red'">
          {{ product.stock > 0 ? 'In Stock (' + product.stock + ')' : 'Out of Stock' }}
        </small>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button color="primary" [routerLink]="['/products', product._id]">
          <mat-icon>visibility</mat-icon> View
        </button>
        <button mat-raised-button color="accent"
                [disabled]="product.stock === 0"
                (click)="addToCartFn()">
          <mat-icon>add_shopping_cart</mat-icon> Add to Cart
        </button>
      </mat-card-actions>
    </mat-card>
