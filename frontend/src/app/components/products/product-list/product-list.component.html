 <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px">
      <mat-form-field appearance="outline">
        <mat-label>Search</mat-label>
        <input matInput [(ngModel)]="filters.search" (ngModelChange)="loadProducts()" placeholder="Search products...">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>
        <mat-select [(ngModel)]="filters.category" (ngModelChange)="loadProducts()">
          <mat-option value="">All</mat-option>
          <mat-option *ngFor="let c of categories" [value]="c._id">{{ c.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Sort By</mat-label>
        <mat-select [(ngModel)]="filters.sort" (ngModelChange)="loadProducts()">
          <mat-option value="">Default</mat-option>
          <mat-option value="price_asc">Price: Low to High</mat-option>
          <mat-option value="price_desc">Price: High to Low</mat-option>
          <mat-option value="rating">Top Rated</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Min Price</mat-label>
        <input matInput type="number" [(ngModel)]="filters.minPrice" (ngModelChange)="loadProducts()">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Max Price</mat-label>
        <input matInput type="number" [(ngModel)]="filters.maxPrice" (ngModelChange)="loadProducts()">
      </mat-form-field>
    </div>

    <div *ngIf="loading" style="text-align:center;padding:40px">
      <mat-spinner></mat-spinner>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px">
      <app-product-card
        *ngFor="let product of products"
        [product]="product"
        (addToCart)="onAddToCart($event)">
      </app-product-card>
    </div>

    <p *ngIf="!loading && products.length === 0" style="text-align:center;color:#999">
      No products found.
    </p>
