 <h2>🛒 My Cart</h2>

    <div *ngIf="!cart || cart.items?.length === 0" style="text-align:center;padding:40px">
      <mat-icon style="font-size:64px;color:#ccc">shopping_cart</mat-icon>
      <p>Your cart is empty</p>
      <button mat-raised-button color="primary" routerLink="/products">Shop Now</button>
    </div>

    <div *ngIf="cart?.items?.length > 0">
      <table mat-table [dataSource]="cart.items" style="width:100%">
        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef>Product</th>
          <td mat-cell *matCellDef="let item">
            <div style="display:flex;align-items:center;gap:12px">
              <img [src]="item.product?.image || 'https://via.placeholder.com/60'"
                   style="width:60px;height:60px;object-fit:cover;border-radius:4px">
              {{ item.product?.name }}
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>Price</th>
          <td mat-cell *matCellDef="let item">₹{{ item.price | number }}</td>
        </ng-container>

        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef>Qty</th>
          <td mat-cell *matCellDef="let item">{{ item.quantity }}</td>
        </ng-container>

        <ng-container matColumnDef="subtotal">
          <th mat-header-cell *matHeaderCellDef>Subtotal</th>
          <td mat-cell *matCellDef="let item">₹{{ (item.price * item.quantity) | number }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Remove</th>
          <td mat-cell *matCellDef="let item">
            <button mat-icon-button color="warn" (click)="remove(item.product._id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="cols"></tr>
        <tr mat-row *matRowDef="let row; columns: cols"></tr>
      </table>

      <mat-divider style="margin:16px 0"></mat-divider>

      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
        <div>
          <h3>Total: <b style="color:#1976d2">₹{{ cart.totalPrice | number }}</b></h3>
        </div>
        <div style="display:flex;gap:8px">
          <mat-form-field appearance="outline">
            <mat-label>Delivery Address</mat-label>
            <input matInput [(ngModel)]="address" placeholder="Enter address">
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Payment</mat-label>
            <input matInput [(ngModel)]="paymentMode" value="COD">
          </mat-form-field>
          <button mat-raised-button color="primary" (click)="placeOrder()">
            <mat-icon>flash_on</mat-icon> Place Order
          </button>
        </div>
      </div>
    </div>
