<div style="display:flex;justify-content:center;padding:40px">
      <mat-card style="width:400px">
        <mat-card-header>
          <mat-card-title>Login</mat-card-title>
        </mat-card-header>
        <mat-card-content style="padding:16px">
          <mat-form-field appearance="outline" style="width:100%">
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="form.email">
          </mat-form-field>
          <mat-form-field appearance="outline" style="width:100%">
            <mat-label>Password</mat-label>
            <input matInput type="password" [(ngModel)]="form.password">
          </mat-form-field>
        </mat-card-content>
        <mat-card-actions style="padding:0 16px 16px">
          <button mat-raised-button color="primary" style="width:100%" (click)="login()">Login</button>
          <p style="text-align:center;margin-top:8px">
            Don't have account? <a routerLink="/register">Register</a>
          </p>
        </mat-card-actions>
      </mat-card>
    </div>
